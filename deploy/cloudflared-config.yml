# Vai em ~/.cloudflared/config.yml
#
# Antes:
#   cloudflared tunnel login
#   cloudflared tunnel create stay-home-calendar
#   cloudflared tunnel route dns stay-home-calendar faltas.SEUDOMINIO.com
#
# Depois:
#   sudo cloudflared service install

tunnel: stay-home-calendar
credentials-file: /home/vitosoaski/.cloudflared/COLE-O-UUID-AQUI.json

ingress:
  - hostname: faltas.SEUDOMINIO.com
    service: http://localhost:3000
  # Qualquer outro nome que chegue neste túnel morre aqui.
  - service: http_status:404
